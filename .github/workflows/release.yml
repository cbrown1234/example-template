---
name: Release

"on":
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.8"

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    # Forks have none of the upstream tags, so a release there would start over at v0.1.0
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Force branch to workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      # PSR writes released/tag/version to $GITHUB_OUTPUT automatically.
      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: uv run --locked python-semantic-release version

      - name: Publish to GitHub Releases
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
